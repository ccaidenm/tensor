[package]
name = "word-processor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "word_processor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Spell-check local runtime installer: Temurin ships tar.gz JREs on
# linux/mac (zip on windows); LT is always a zip.
tar = "0.4"
flate2 = "1"
# The sidecar health-wait loop (tokio::time::sleep).
tokio = { version = "1", features = ["time"] }
printers = "2.3.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
