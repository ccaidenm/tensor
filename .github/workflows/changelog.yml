name: Changelog

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
        env:
          GITHUB_REPO: ccaidenm/tensor
          OUTPUT: CHANGELOG.md

      - name: Open changelog PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: Update changelog"
          title: "docs: Update changelog"
          body: |
            Automated changelog regeneration (git-cliff).

            This PR updates itself on new pushes and closes itself out
            when there is nothing to change.
          branch: chore/changelog-update
          add-paths: CHANGELOG.md
          delete-branch: true
